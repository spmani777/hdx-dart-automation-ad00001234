apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dart-automation-ingress
  namespace: default
  annotations:
    # Use Google Cloud's HTTP Load Balancer
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dart-automation-service
            port:
              number: 80
