name: "04 - Continuous Deployment (DEV Environment)"

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hdx-dart-automation
  APM_ID: ${{ vars.APM_ID || 'AD00001234' }}
  TRACK: ${{ vars.TRACK || 'HDX' }}

jobs:
  build-and-deploy-dev:
    name: "Build & Deploy to DEV"
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.bank.internal/api/v1/health/ready

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry (GHCR / Harbor)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          labels: |
            enterprise.apm_id=${{ env.APM_ID }}
            enterprise.track=${{ env.TRACK }}
            enterprise.environment=dev
            enterprise.commit_sha=${{ github.sha }}

      - name: Deploy Container Service (DEV Simulation)
        run: |
          echo "Starting DaRT container in DEV sandbox..."
          docker run -d --name dart-dev-service -p 8080:8080 \
            -e ENVIRONMENT=dev \
            -e APM_ID=${{ env.APM_ID }} \
            -e TRACK=${{ env.TRACK }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          echo "Waiting 10s for container startup..."
          sleep 10

      - name: Run Post-Deploy Health & Smoke Probes
        uses: ./.github/actions/run-smoke-probes
        with:
          target-url: "http://localhost:8080"
          max-retries: 6

      - name: Teardown Dev Sandbox
        if: always()
        run: |
          docker stop dart-dev-service || true
          docker rm dart-dev-service || true
