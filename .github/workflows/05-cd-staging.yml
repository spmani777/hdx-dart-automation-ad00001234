name: "05 - Continuous Deployment (STAGING / Non-Prod Environment)"

on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hdx-dart-automation
  APM_ID: ${{ vars.APM_ID || 'AD00001234' }}
  TRACK: ${{ vars.TRACK || 'HDX' }}

jobs:
  deploy-staging:
    name: "Deploy to STAGING (Non-Prod UAT)"
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.bank.internal/api/v1/health/ready

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Staging Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          labels: |
            enterprise.apm_id=${{ env.APM_ID }}
            enterprise.track=${{ env.TRACK }}
            enterprise.environment=staging

      - name: Deploy to Staging Cluster / Sandbox
        run: |
          echo "Deploying DaRT staging cluster instance..."
          docker run -d --name dart-staging-service -p 8080:8080 \
            -e ENVIRONMENT=staging \
            -e APM_ID=${{ env.APM_ID }} \
            -e TRACK=${{ env.TRACK }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          echo "Waiting 10s for container startup..."
          sleep 10

      - name: Validate Health via Smoke Probes
        uses: ./.github/actions/run-smoke-probes
        with:
          target-url: "http://localhost:8080"

      - name: Execute End-to-End API Integration & Regression Suite
        run: |
          pip install httpx pytest
          python -m pytest tests/integration/ -v

      - name: Teardown Staging Instance
        if: always()
        run: |
          docker stop dart-staging-service || true
          docker rm dart-staging-service || true
