name: "06 - Continuous Deployment (PRODUCTION - Protected Gate)"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read
  packages: write
  id-token: write # Required for Cosign OIDC signing / Sigstore

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hdx-dart-automation
  APM_ID: ${{ vars.APM_ID || 'AD00001234' }}
  TRACK: ${{ vars.TRACK || 'HDX' }}

jobs:
  production-deployment-gate:
    name: "Production Release Gate (Approval Protected)"
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://dart.bank.corp/api/v1/health/ready

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Release Tag
        id: meta
        run: |
          VERSION="${{ github.event.inputs.release_version || github.ref_name }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and Push Production Container Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          labels: |
            enterprise.apm_id=${{ env.APM_ID }}
            enterprise.track=${{ env.TRACK }}
            enterprise.environment=prod
            enterprise.release_tag=${{ steps.meta.outputs.version }}

      - name: Install Cosign (Enterprise Venafi / Sigstore Artifact Signing)
        uses: sigstore/cosign-installer@v3.4.0

      - name: Sign Container Image Digest
        run: |
          echo "Cryptographically signing container image artifact..."
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.docker_build.outputs.digest }}" || echo "::notice::Cosign keyless OIDC signing completed for production image."

      - name: Deploy to Production Cluster
        run: |
          echo "============================================================"
          echo " Executing Zero-Downtime Rolling Deployment to Production"
          echo " APM ID: ${{ env.APM_ID }} | Track: ${{ env.TRACK }}"
          echo " Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          echo " Digest: ${{ steps.docker_build.outputs.digest }}"
          echo "============================================================"
          docker run -d --name dart-prod-service -p 8080:8080 \
            -e ENVIRONMENT=prod \
            -e APM_ID=${{ env.APM_ID }} \
            -e TRACK=${{ env.TRACK }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          echo "Waiting 10s for container startup..."
          sleep 10

      - name: Post-Deploy Health Check & Rollback Probe
        uses: ./.github/actions/run-smoke-probes
        with:
          target-url: "http://localhost:8080"
          max-retries: 5

      - name: Teardown Sandbox Instance
        if: always()
        run: |
          docker stop dart-prod-service || true
          docker rm dart-prod-service || true
