name: "Setup Python Environment & Dependency Cache"
description: "Enterprise composite action for standardizing Python runtime and dependency caching."

inputs:
  python-version:
    description: "Python version to set up"
    required: false
    default: "3.11"
  install-dev:
    description: "Whether to install development requirements"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: "requirements-dev.txt"

    - name: Upgrade pip and install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.install-dev }}" = "true" ]; then
          pip install -r requirements-dev.txt
        else
          pip install -r requirements.txt
        fi

